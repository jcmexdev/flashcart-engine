services:
  order_service:
    build:
      context: .
      dockerfile: ./services/order-service/build/Dockerfile.dev
    volumes:
      - .:/app
    working_dir: /app/services/order-service
    command: air
    ports:
      - "8081:8080"
    env_file:
      - ./services/order-service/.env
    networks:
      - flashcart_engine_network
    depends_on:
      postgres:
        condition: service_healthy

  inventory_service:
    build:
      context: .
      dockerfile: ./services/inventory-service/build/Dockerfile.dev
    volumes:
      - .:/app
    working_dir: /app/services/inventory-service
    command: air
    ports:
      - "8082:8080"
    networks:
      - flashcart_engine_network
    depends_on:
      postgres:
        condition: service_healthy

  payment_service:
    build:
      context: .
      dockerfile: ./services/payment-service/build/Dockerfile.dev
    volumes:
      - .:/app
    working_dir: /app/services/payment-service
    command: air
    ports:
      - "8083:8080"
    networks:
      - flashcart_engine_network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: flashcart_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts/init_databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flashcart_engine_network

  redis:
    image: redis:7-alpine
    container_name: flashcart_redis
    ports:
      - "6379:6379"
    networks:
      - flashcart_engine_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: flashcart_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - flashcart_engine_network

volumes:
  pgdata:

networks:
  flashcart_engine_network:
    driver: bridge